<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>404 — Страница не найдена</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            height: -webkit-fill-available;
        }

        body {
            min-height: 100vh;
            min-height: -webkit-fill-available;
            min-height: 100dvh;
            position: fixed;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(-45deg, #0f0c29, #302b63, #24243e, #654ea3);
            background-size: 400% 400%;
            animation: gradientBG 15s ease infinite;
            overflow-y: auto;
            overflow-x: hidden;
            touch-action: manipulation;
            overscroll-behavior: none;
            -webkit-overflow-scrolling: touch;
            padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
        }

        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .particles {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
        }

        .particle {
            position: absolute;
            width: 6px;
            height: 6px;
            background: rgba(255, 255, 255, 0.5);
            border-radius: 50%;
            animation: float 20s infinite;
        }

        @keyframes float {
            0%, 100% {
                transform: translateY(100dvb) rotate(0deg);
                opacity: 0;
            }
            10% {
                opacity: 1;
            }
            90% {
                opacity: 1;
            }
            100% {
                transform: translateY(-100dvb) rotate(720deg);
                opacity: 0;
            }
        }

        .container {
            position: relative;
            z-index: 2;
            text-align: center;
            padding: clamp(32px, 7vw, 60px) clamp(22px, 5.5vw, 50px);
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-radius: clamp(16px, 3.5vw, 24px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            box-shadow: 
                0 25px 50px -12px rgba(0, 0, 0, 0.5),
                inset 0 1px 0 rgba(255, 255, 255, 0.1);
            max-width: 600px;
            width: calc(100% - clamp(20px, 5vw, 40px));
            max-height: calc(100dvh - clamp(20px, 5vw, 40px));
            overflow-y: auto;
            overflow-x: hidden;
            animation: slideIn 0.8s ease-out;
            transform: translateZ(0);
            will-change: transform;
            -webkit-overflow-scrolling: touch;
            scrollbar-width: none;
        }

        .container::-webkit-scrollbar {
            display: none;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .glow {
            position: absolute;
            top: 50%;
            left: 50%;
            width: min(500px, 90vw);
            height: min(500px, 90vw);
            background: radial-gradient(circle, rgba(101, 78, 163, 0.4) 0%, transparent 70%);
            transform: translate(-50%, -50%);
            z-index: 1;
            animation: pulse 4s ease-in-out infinite;
            pointer-events: none;
        }

        @keyframes pulse {
            0%, 100% { transform: translate(-50%, -50%) scale(1); opacity: 0.6; }
            50% { transform: translate(-50%, -50%) scale(1.2); opacity: 1; }
        }

        .error-code {
            font-size: clamp(88px, 22vw, 180px);
            font-weight: 900;
            background: linear-gradient(135deg, #fff 0%, #a18cd1 50%, #fbc2eb 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            line-height: 1;
            margin-bottom: clamp(14px, 3vw, 20px);
            letter-spacing: clamp(-2px, -0.5vw, -5px);
            filter: drop-shadow(0 0 40px rgba(161, 140, 209, 0.5));
            animation: glitch 5s infinite;
            will-change: transform;
            backface-visibility: hidden;
            -webkit-backface-visibility: hidden;
        }

        @keyframes glitch {
            0%, 90%, 100% {
                transform: translate(0);
            }
            92% {
                transform: translate(-3px, 2px);
            }
            94% {
                transform: translate(3px, -2px);
            }
            96% {
                transform: translate(-2px, -2px);
            }
            98% {
                transform: translate(2px, 2px);
            }
        }

        .title {
            font-size: clamp(22px, 4.8vw, 36px);
            font-weight: 700;
            color: #fff;
            margin-bottom: clamp(12px, 2.5vw, 16px);
            letter-spacing: -0.5px;
        }

        .subtitle {
            font-size: clamp(13px, 2.6vw, 18px);
            color: rgba(255, 255, 255, 0.75);
            line-height: clamp(1.5, 2.5vw, 1.7);
            margin-bottom: clamp(26px, 5vw, 40px);
            max-width: min(450px, 100%);
            margin-left: auto;
            margin-right: auto;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            padding: clamp(13px, 3vw, 16px) clamp(30px, 7vw, 40px);
            font-size: clamp(14px, 3vw, 16px);
            font-weight: 600;
            color: #fff;
            text-decoration: none;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border-radius: 50px;
            border: none;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 
                0 10px 30px rgba(102, 126, 234, 0.4),
                inset 0 1px 0 rgba(255, 255, 255, 0.2);
            position: relative;
            overflow: hidden;
            -webkit-tap-highlight-color: transparent;
            touch-action: manipulation;
        }

        .btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(
                90deg,
                transparent,
                rgba(255, 255, 255, 0.2),
                transparent
            );
            transition: left 0.6s ease;
        }

        .btn:hover::before {
            left: 100%;
        }

        .btn:hover {
            transform: translateY(-3px);
            box-shadow: 
                0 15px 40px rgba(102, 126, 234, 0.6),
                inset 0 1px 0 rgba(255, 255, 255, 0.3);
        }

        .btn:active {
            transform: translateY(-1px);
        }

        .btn svg {
            transition: transform 0.3s ease;
            flex-shrink: 0;
        }

        .btn:hover svg {
            transform: translateX(-4px);
        }

        .tips {
            margin-top: clamp(26px, 5vw, 40px);
            padding-top: clamp(20px, 4vw, 30px);
            border-top: 1px solid rgba(255, 255, 255, 0.1);
        }

        .tips-title {
            font-size: clamp(11px, 2.2vw, 13px);
            text-transform: uppercase;
            letter-spacing: 2px;
            color: rgba(255, 255, 255, 0.5);
            margin-bottom: clamp(10px, 2.2vw, 16px);
            font-weight: 600;
        }

        .tips-list {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: clamp(6px, 1.5vw, 10px);
        }

        .tip {
            padding: clamp(6px, 1.5vw, 8px) clamp(12px, 3vw, 18px);
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 20px;
            font-size: clamp(11px, 2.2vw, 13px);
            color: rgba(255, 255, 255, 0.7);
            transition: all 0.3s ease;
            cursor: pointer;
            text-decoration: none;
            -webkit-tap-highlight-color: transparent;
            white-space: nowrap;
        }

        .tip:hover {
            background: rgba(255, 255, 255, 0.15);
            color: #fff;
            transform: translateY(-2px);
        }

        @media (max-width: 440px) {
            body {
                align-items: flex-start;
                justify-content: center;
                padding-top: max(env(safe-area-inset-top), 16px);
                padding-bottom: max(env(safe-area-inset-bottom), 16px);
            }

            .container {
                width: calc(100% - 24px);
                max-height: none;
                overflow: visible;
                margin: auto 0;
            }

            .error-code {
                font-size: clamp(78px, 24vw, 108px);
                margin-bottom: 12px;
            }

            .subtitle {
                margin-bottom: 28px;
                line-height: 1.55;
            }

            .tips {
                margin-top: 28px;
                padding-top: 22px;
            }

            .tips-title {
                margin-bottom: 12px;
            }
        }

        @media (max-width: 560px) {
            .tips-list {
                gap: 8px;
            }

            .tip {
                padding: 6px 13px;
                font-size: 12px;
            }
        }

        @media (max-height: 700px) {
            body {
                align-items: flex-start;
                padding-top: 20px;
                padding-bottom: 20px;
            }

            .container {
                max-height: none;
                overflow: visible;
            }

            .error-code {
                font-size: clamp(72px, 18vw, 110px);
            }
        }
    </style>
</head>
<body>
    <div class="particles" id="particles"></div>
    <div class="glow"></div>

    <div class="container">
        <div class="error-code">404</div>
        <h1 class="title">Упс! Страница потерялась</h1>
        <p class="subtitle">
            Похоже, запрашиваемая страница ушла в другое измерение. Сайт на доработке. 
      
        </p>

        <a href="https://vk.ru/psichologin" class="btn">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <line x1="19" y1="12" x2="5" y2="12"></line>
                <polyline points="12 19 5 12 12 5"></polyline>
            </svg>
            Инна Пилипенко
        </a>
    </div>

    <script>
        const particlesContainer = document.getElementById('particles');
        const particleCount = window.innerWidth < 500 ? 28 : 40;

        for (let i = 0; i < particleCount; i++) {
            const particle = document.createElement('div');
            particle.className = 'particle';
            particle.style.left = Math.random() * 100 + '%';
            particle.style.animationDelay = Math.random() * 20 + 's';
            particle.style.animationDuration = (10 + Math.random() * 20) + 's';
            particle.style.width = (3 + Math.random() * 6) + 'px';
            particle.style.height = particle.style.width;
            particle.style.opacity = 0.3 + Math.random() * 0.5;
            particlesContainer.appendChild(particle);
        }
    </script>
</body>
</html>
